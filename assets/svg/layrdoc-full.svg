<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 32 440 118">
  <defs>
    <!-- Modern smooth gradients -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>


    <!-- Enhanced text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5FF"/>
      <stop offset="40%" style="stop-color:#FFFFFF"/>
      <stop offset="75%" style="stop-color:#A46BFF"/>
      <stop offset="100%" style="stop-color:#FF4FD8"/>
    </linearGradient>

    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121B38" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="1"/>
    </radialGradient>

    <!-- Glow filter -->


    <!-- Strong outer glow -->


    <!-- Text glow -->


    <!-- Scanline pattern -->
    <pattern id="scanlines" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="rgba(255,255,255,0.03)"/>
    </pattern>

    <!-- Futuristic grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,220,255,0.06)" stroke-width="0.5"/>
    </pattern>


  </defs>
  <!-- Transparent background -->

  <!-- ===== ICON ===== -->

  <!-- Bottom slab -->

<polygon points="80,105 46,86 46,68 80,87 114,68 114,86"
 fill="none" stroke="#A855F7" stroke-width="1.6" stroke-opacity="0.55"/> <polygon points="80,105 46,86 80,67 114,86"
 fill="url(#neonGrad)" fill-opacity="0.12"/>

  <!-- Middle slab -->

<polygon points="80,92 46,73 46,55 80,74 114,55 114,73"
 fill="none" stroke="url(#neonGrad)" stroke-width="1.8" stroke-opacity="0.8"/> <polygon points="80,92 46,73 80,54 114,73"
 fill="url(#neonGrad)" fill-opacity="0.14"/>

  <!-- Top slab -->

<polygon points="80,79 46,60 46,42 80,61 114,42 114,60"
 fill="none" stroke="url(#neonGrad)" stroke-width="2.2" /> <polygon points="80,79 46,60 80,41 114,60"
 fill="url(#neonGrad)" fill-opacity="0.18" />

  <!-- Center glow node -->

  <circle cx="80" cy="60" r="4" fill="url(#neonGrad)" />
  <circle cx="80" cy="60" r="1.8" fill="white"/>

  <!-- Spine -->

<line x1="80" y1="61" x2="80" y2="105"
 stroke="url(#neonGrad)"
 stroke-width="1"
 stroke-opacity="0.35"
 stroke-dasharray="2,3"/>

  <!-- Side indicators -->

  <line x1="114" y1="60" x2="124" y2="60" stroke="url(#neonGrad)" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="114" y1="73" x2="121" y2="73" stroke="url(#neonGrad)" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="114" y1="86" x2="119" y2="86" stroke="url(#neonGrad)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- ===== WORDMARK ===== -->

<text x="142" y="98"
 font-family="'Trebuchet MS', 'Lucida Sans Unicode', sans-serif"
 font-size="58"
 font-weight="800"
 letter-spacing="-2"
 fill="url(#textGrad)"
 >LayrDoc</text>

  <!-- Accent underline -->

<line x1="142" y1="108" x2="430" y2="108"
 stroke="url(#neonGrad)"
 stroke-width="1.8"
 stroke-opacity="0.65"/>

  <!-- Tagline -->

<text x="144" y="126"
 font-family="'Courier New', monospace"
 font-size="11"
 fill="#7DEBFF"
 fill-opacity="0.72"
 letter-spacing="4">INTELLIGENT CODE · DOCUMENTATION ENGINE</text>

  <!-- Status dots -->

  <circle cx="144" cy="140" r="2.8" fill="url(#neonGrad)" fill-opacity="0.9" />
  <circle cx="154" cy="140" r="2.8" fill="url(#neonGrad)" fill-opacity="0.5"/>
  <circle cx="164" cy="140" r="2.8" fill="#C43CFF" fill-opacity="0.5"/>
</svg>
